<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View your UniMeet event companions and mutual matches.">
  <title>Matches — UniMeet</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/unimeet-logo.svg">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="matches">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="app-layout" id="app-shell">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Primary navigation"></aside>

    <main id="main-content" class="app-main">
      <div class="page-header">
        <div>
          <h1>Matches &amp; Liked Events</h1>
          <p class="muted-small">People you matched with and events you liked — message organizers directly.</p>
        </div>
        <a href="discover.html" class="btn btn-primary">Keep discovering</a>
      </div>

      <div class="segmented-tabs" role="tablist" aria-label="Match sections">
        <button type="button" class="tab-btn is-active" data-match-tab="all" role="tab" aria-selected="true">All</button>
        <button type="button" class="tab-btn" data-match-tab="events" role="tab" aria-selected="false">Liked Events</button>
        <button type="button" class="tab-btn" data-match-tab="people" role="tab" aria-selected="false">People Matches</button>
      </div>

      <div id="matches-container"></div>
    </main>

    <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Mobile navigation"></nav>
  </div>

  <script type="module" src="js/navigation.js"></script>
  <script type="module" src="js/matches.js"></script>
</body>
</html>
